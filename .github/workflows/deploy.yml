name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # Publish under the namespace of whichever fork is pushing: the workflow
  # logs in as the pushing actor, so a fixed upstream owner here makes
  # docker/push fail with "permission_denied" in every fork.
  IMAGE_NAME: ${{ github.repository_owner }}/openoutreach

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: HOST_UID=$(id -u) HOST_GID=$(id -g) make docker-test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./compose/openoutreach/Dockerfile
          build-args: |
            BUILD_ENV=production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Notify the hub repo that a new image was published (image-updated).
      # Prod runs on the shared GCP VM (Compute Engine), not a DigitalOcean snapshot.
      # The dispatch target belongs to the upstream owner, so it is skipped in
      # this fork rather than failing on a token with no access to it.
      - name: Notify hub of new image
        if: ${{ github.repository_owner == 'eracle' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: eracle/hub.openoutreach.app
          event-type: image-updated
